[workspace]
resolver = "2"
members = ["crates/common", "crates/nixos-updater", "crates/storage-optimizer"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
libc = "0.2"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
