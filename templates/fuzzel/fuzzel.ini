# deep-space — fuzzel
[main]
font=JetBrainsMono Nerd Font:size=12
prompt="  "
terminal=ghostty -e
layer=overlay
width=44
lines=10
horizontal-pad=20
vertical-pad=14
inner-pad=8
icons-enabled=yes

[colors]
background={{void_nohash}}ee
text={{text_nohash}}ff
prompt={{violet_nohash}}ff
placeholder={{muted_nohash}}ff
input={{text_nohash}}ff
match={{violet_nohash}}ff
selection={{overlay_nohash}}ff
selection-text={{text_nohash}}ff
selection-match={{green_nohash}}ff
border={{violet_nohash}}cc

[border]
width=2
radius=14
