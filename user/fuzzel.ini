# fuzzel, themed to match the rest of this machine: black background, phosphor
# green text, JetBrains Mono -- the same palette as the Ghostty CRT theme and
# the Matrix Code Rain greeter.
#
# This is the launcher bound to SUPER + SPACE (user/hyprland.lua). It also
# styles the "Open With" picker from modules/apps-extra.nix, which is the same
# binary in --dmenu mode, so both surfaces look alike.

font=JetBrainsMono Nerd Font:size=13
line-height=22
prompt="> "
placeholder=search
layer=top
width=46
lines=10
horizontal-pad=20
vertical-pad=14
inner-pad=8
image-size-ratio=0.9

# hicolor is where this configuration installs its own application icons (the
# Legacy iOS Kit and VM manager entries included), and no GTK icon theme is set
# in user/gtk-settings.ini, so there is nothing else to inherit.
icon-theme=hicolor
icons-enabled=yes

# Desktop entries with Terminal=true. Without this, fuzzel falls back to
# xterm, which is not installed here.
terminal=ghostty -e

# Match on more than the name, so "dfu" or "restore" finds Legacy iOS Kit.
fields=name,generic,comment,categories,keywords
match-mode=fuzzy
show-actions=yes
exit-on-keyboard-focus-loss=yes

[colors]
background=050805f0
text=00c832ff
prompt=00ff41ff
input=00ff41ff
placeholder=00560aff
match=00ff41ff
selection=00230cff
selection-text=00ff41ff
selection-match=cfffd8ff
counter=008f11ff
border=008f11ff

[border]
width=1
radius=2
